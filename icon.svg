<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="bg" cx="54" cy="54" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202C30"/>
      <stop offset="1" stop-color="#151D20"/>
    </radialGradient>
    <radialGradient id="glow" cx="54" cy="54" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8B06A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E8B06A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- The two groups become the background and foreground layers of the
       Android adaptive icon (see branding/export_icons.ps1). -->
  <g id="background">
    <rect width="108" height="108" fill="url(#bg)"/>
  </g>
  <g id="foreground">
    <circle cx="54" cy="54" r="26" fill="url(#glow)"/>
    <circle cx="54" cy="54" r="27" fill="none" stroke="#EDE4D3" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="3 3.6" stroke-linecap="round"/>
    <circle cx="54" cy="54" r="11" fill="#E8B06A"/>
    <circle cx="50.8" cy="50.6" r="3.6" fill="#F6DDB4" fill-opacity="0.7"/>
    <!-- A single bolt on its way to an intruder -->
    <circle cx="63.6" cy="44.4" r="1" fill="#EDE4D3" fill-opacity="0.3"/>
    <circle cx="66" cy="42" r="1.4" fill="#EDE4D3" fill-opacity="0.55"/>
    <circle cx="68.4" cy="39.6" r="2" fill="#EDE4D3"/>
    <circle cx="74.5" cy="33.5" r="3.6" fill="#C97B63"/>
  </g>
</svg>
